<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#020617" />
        <meta name="description" content="Compare live airline fares from the world's top airlines, with taxes and fees included and a 24/7 travel desk." />
        <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <link rel="preconnect" href="https://images.unsplash.com" />
        <script>
          // Home page only: start downloading the first hero photo before the app's JavaScript asks for it.
          // Must match the first slide in src/components/HeroSlideshow.jsx.
          window.__heroSet = [480, 750, 1080, 1600, 2200].map(function (w) { return "https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=" + w + "&q=" + (w > 1080 ? 40 : 55) + " " + w + "w"; }).join(", ");
          if (location.pathname === "/") {
            var l = document.createElement("link");
            l.rel = "preload"; l.as = "image"; l.fetchPriority = "high";
            l.imageSrcset = window.__heroSet; l.imageSizes = "100vw";
            document.head.appendChild(l);
          }
        </script>
        <!-- Self-hosted Plus Jakarta Sans (SIL OFL, see fonts/OFL.txt): one variable file for every weight.
             The system font shows until it arrives. -->
        <link rel="preload" href="%PUBLIC_URL%/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
        <style>
          @font-face {
            font-family: "Plus Jakarta Sans";
            font-style: normal;
            font-weight: 200 800;
            font-display: swap;
            src: url("%PUBLIC_URL%/fonts/plus-jakarta-sans-latin.woff2") format("woff2");
          }
        </style>
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>AllSkyFares</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->

    </body>
</html>
